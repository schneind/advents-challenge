<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎄 Advents-Challenge</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
padding:16px;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:#fff;
user-select:none;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url("bg.png") center/cover no-repeat fixed;
}
.card{
max-width:720px;
margin:auto;
background:rgba(0,0,0,.35);
padding:20px;
border-radius:20px;
border:1px solid rgba(255,255,255,.2);
}
.hidden{display:none}
h1,h2,h3{text-align:center;margin:0 0 10px}
p{text-align:center}
button{
padding:12px 20px;
border:none;
border-radius:12px;
cursor:pointer;
background:linear-gradient(135deg,#ffd166,#ffb347);
font-weight:700;
margin:6px;
}
.big-red{
width:120px;
height:120px;
border-radius:50%;
background:#c62828;
color:#fff;
font-size:20px;
box-shadow:0 0 20px rgba(255,0,0,.6);
}
input{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin:8px 0;
font-size:16px;
}
.story-box{
background:rgba(0,0,0,.4);
padding:12px;
border-radius:12px;
max-height:220px;
overflow:auto;
font-size:14px;
line-height:1.4;
}
.gift-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}
.gift-btn{
font-size:22px;
padding:14px;
}
canvas{background:#022;border-radius:12px}
</style>
</head>

<body>

<!-- PASSWORT -->
<div id="pwScreen" style="text-align:center;padding:40px">
<h2>🔐 Passwort</h2>
<input id="pwInput" type="password" placeholder="Passwort">
<button onclick="checkPW()">Start</button>
<p id="pwError" style="color:#ff9999;display:none">Falsches Passwort</p>
</div>

<div id="game" class="card hidden">

<!-- INTRO -->
<section id="intro">
<h1>🎄 Advents-Challenge</h1>
<input id="playerName" placeholder="Dein Name">
<button onclick="startQuiz()">Los geht’s ▶️</button>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
<h2>❄️ Quiz</h2>
<p id="quizQ"></p>
<div id="quizA"></div>
</section>

<!-- LABYRINTH INFO -->
<section id="mazeInfo" class="hidden">
<h2>🎅 Labyrinth</h2>
<p>Finde den Weg zur Geschenk-Kiste.</p>
<button onclick="startMaze()">Start ▶️</button>
</section>

<!-- LABYRINTH -->
<section id="mazeScreen" class="hidden">
<canvas id="maze" width="320" height="320"></canvas>
<p id="mazeTime"></p>
<div style="text-align:center">
<button onclick="moveSanta(0,-1)">⬆️</button><br>
<button onclick="moveSanta(-1,0)">⬅️</button>
<button onclick="moveSanta(1,0)">➡️</button><br>
<button onclick="moveSanta(0,1)">⬇️</button>
</div>
</section>

<!-- GLOCKE -->
<section id="bell" class="hidden">
<h2>🔔 Glocken-Reflex</h2>
<div id="bellSymbol" style="font-size:64px;text-align:center">❄️</div>
<div style="text-align:center">
<button id="bellStart" onclick="startBell()">Start</button><br>
<button id="bellBtn" class="big-red hidden" onclick="pressBell()">DRÜCKEN</button>
</div>
<p id="bellInfo" style="text-align:center"></p>
</section>

<!-- SCHÄTZFRAGEN -->
<section id="guess" class="hidden">
<h2>📏 Schätzfragen</h2>
<p id="guessQ"></p>
<input id="guessInput" placeholder="z. B. 17">
<p id="guessRes"></p>
</section>

<!-- STORY -->
<section id="story" class="hidden">
<h2>🕵️ True-Crime-Story</h2>
<div class="story-box" id="storyText"></div>
<button onclick="startStoryQ()">Gelesen ▶️</button>
<div id="storyQ" class="hidden"></div>
</section>

<!-- TIMER -->
<section id="timer" class="hidden">
<h2>⏱ 10-Sekunden-Challenge</h2>
<button id="timerBtn" onclick="toggleTimer()">Start</button>
<p id="timerRes"></p>
</section>

<!-- BOMBEN -->
<section id="bomb" class="hidden">
<h2>🎁 Bomben-Geschenke</h2>
<div class="gift-grid" id="bombGrid"></div>
<p id="bombRes"></p>
</section>

<!-- RESULT -->
<section id="result" class="hidden">
<h2>🏆 Ergebnis</h2>
<p id="resText"></p>
</section>

</div>

<script>
/* ---------- NAV ---------- */
function show(id){
["intro","quiz","mazeInfo","mazeScreen","bell","guess","story","timer","bomb","result"]
.forEach(s=>document.getElementById(s).classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

/* ---------- PASSWORT ---------- */
function checkPW(){
if(pwInput.value==="HOTMarco"){
pwScreen.style.display="none";
game.classList.remove("hidden");
show("intro");
}else pwError.style.display="block";
}

/* ---------- QUIZ ---------- */
let points=0;
const quiz=[
["In welchem Land heißt der Weihnachtsmann „Joulupukki“?",["Schweden","Finnland","Norwegen","Island"],1],
["Wo lebt der Weihnachtsmann laut Legende?",["Alaska","Nordpol","Lappland","Kanada"],1]
];
let qi=0;
function startQuiz(){
if(!playerName.value.trim()){alert("Bitte Name eingeben");return;}
qi=0;points=0;
show("quiz");renderQuiz();
}
function renderQuiz(){
if(qi>=quiz.length){show("mazeInfo");return;}
quizQ.textContent=quiz[qi][0];
quizA.innerHTML="";
quiz[qi][1].forEach((a,i)=>{
let b=document.createElement("button");
b.textContent=a;
b.onclick=()=>{
points+= i===quiz[qi][2] ? 10 : -5;
qi++;renderQuiz();
};
quizA.appendChild(b);
});
}

/* ---------- LABYRINTH ---------- */
const map=[
[0,0,1,1],
[1,0,0,1],
[1,1,0,2],
[1,1,0,1]
];
let santa={x:0,y:0},startTime;
const ctx=maze.getContext("2d");
function startMaze(){
santa={x:0,y:0};
startTime=performance.now();
show("mazeScreen");
drawMaze();
}
function drawMaze(){
ctx.clearRect(0,0,320,320);
for(let y=0;y<4;y++)for(let x=0;x<4;x++){
ctx.fillStyle=map[y][x]===1?"#123":"#075";
ctx.fillRect(x*80,y*80,80,80);
if(map[y][x]===2){
ctx.fillStyle="#fc0";
ctx.fillRect(x*80+20,y*80+20,40,40);
}
}
ctx.fillStyle="#e33";
ctx.beginPath();
ctx.arc(santa.x*80+40,santa.y*80+40,20,0,Math.PI*2);
ctx.fill();
mazeTime.textContent=((performance.now()-startTime)/1000).toFixed(2)+" s";
}
function moveSanta(dx,dy){
let nx=santa.x+dx,ny=santa.y+dy;
if(nx<0||ny<0||nx>=4||ny>=4||map[ny][nx]===1)return;
santa={x:nx,y:ny};
if(map[ny][nx]===2){
points+=50;
show("bell");
}
drawMaze();
}

/* ---------- GLOCKE ---------- */
const bellSeq=["❄️","🎄","🔔","⭐","🔔","🎁","🔔"];
let bi=0;
function startBell(){
bellStart.classList.add("hidden");
bellBtn.classList.remove("hidden");
bi=0;nextBell();
}
function nextBell(){
if(bi>=bellSeq.length){show("guess");return;}
bellSymbol.textContent=bellSeq[bi++];
setTimeout(nextBell,600);
}
function pressBell(){
points+= bellSymbol.textContent==="🔔" ? 10 : -3;
}

/* ---------- SCHÄTZFRAGEN ---------- */
const guesses=[
["Christbäume in Deutschland (in Millionen)",23],
["Truthahnfleisch USA pro Kopf (kg)",0.68],
["Glühwein in Deutschland (in Mio. Litern)",50],
["DHL-Pakete im Dezember (in Millionen)",675],
["Weihnachtsmärkte in Deutschland (Anzahl)",2500],
["Schoko-Weihnachtsmänner pro Kopf",1.8],
["Weihnachtsausgaben pro Person (€)",550],
["Nürnberg → Nordpol (km)",4200]
];
let gi=0;
function showGuess(){
if(gi>=guesses.length){show("story");return;}
guessQ.textContent=guesses[gi][0];
guessInput.value="";
guessRes.textContent="";
}
guessInput.onchange=()=>{
let v=parseFloat(guessInput.value.replace(",",".")),c=guesses[gi][1];
if(isNaN(v))return;
let d=Math.abs(v-c)/c*100;
let p=d<=2?20:d<=5?15:d<=10?10:d<=20?5:0;
points+=p;
guessRes.innerHTML=`Richtig: <b>${c}</b> – Punkte: <b>${p}</b>`;
gi++;
setTimeout(showGuess,3000);
};

/* ---------- STORY (keine HOT-Marco-Frage!) ---------- */
const storyTextContent=
`Am 17.12.2003 verschwanden exakt 312 Wunschzettel aus dem gesicherten Archivraum B-24.
Laut Protokoll war der Weihnachtsmann zwischen 22:30 und 23:10 Uhr allein dort.
Auffällig war eine rote Thermoskanne mit der Aufschrift „Beweismaterial“,
gefüllt mit einem stark gewürzten Glühwein namens „HOT Marco“ – im Archiv strikt verboten.
Zusätzlich wurde der Zugangscode kurz zuvor auf 1225 geändert.
Der Fall wurde später als ethisch motivierte Manipulation geschlossen:
Ein Erwachsener sollte nicht zum siebten Mal denselben Bluetooth-Sockenwärmer bekommen.`;

const storyQuestions=[
["Wie viele Wunschzettel verschwanden?",["302","312","320","1225"],1],
["Welcher Raum war betroffen?",["A-12","B-24","C-17","X-MAS"],1],
["Warum wurde der Fall geschlossen?",["Softwarefehler","Elfenstreik","Ethische Manipulation","Zeitmangel"],2]
];
let si=0;
storyText.textContent=storyTextContent;

function startStoryQ(){
storyQ.classList.remove("hidden");
nextStoryQ();
}
function nextStoryQ(){
if(si>=storyQuestions.length){show("timer");return;}
storyQ.innerHTML="";
storyQuestions[si][1].forEach((a,i)=>{
let b=document.createElement("button");
b.textContent=a;
b.onclick=()=>{
if(i===storyQuestions[si][2])points+=10;
si++;nextStoryQ();
};
storyQ.appendChild(b);
});
}

/* ---------- TIMER ---------- */
let tStart=0,running=false;
function toggleTimer(){
if(!running){
running=true;tStart=performance.now();timerBtn.textContent="Stopp";
}else{
running=false;
let t=(performance.now()-tStart)/1000;
let d=Math.abs(t-10);
let p=d<0.1?50:d<0.5?30:10;
points+=p;
timerRes.textContent=`${t.toFixed(2)} s → ${p} Punkte`;
setTimeout(startBomb,1500);
}
}

/* ---------- BOMBEN ---------- */
let bomb=Math.floor(Math.random()*6);
function startBomb(){
show("bomb");
bombGrid.innerHTML="";
bombRes.textContent="";
for(let i=0;i<6;i++){
let b=document.createElement("button");
b.className="gift-btn";
b.textContent="🎁";
b.onclick=()=>{
if(i===bomb){
b.textContent="💣";
finish();
}else{
b.textContent="✅";
points+=5;
}
};
bombGrid.appendChild(b);
}
}
function finish(){
show("result");
resText.innerHTML=`<b>${playerName.value}</b>, du hast <b>${points}</b> Punkte erzielt!`;
}
</script>

</body>
</html>
