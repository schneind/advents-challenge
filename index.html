function checkPW(){ let pw=document.getElementById('pwInput').value.trim(); if(pw==='HOTMarco'){ document.getElementById('pwScreen').style.display='none'; initIntro(); } else document.getElementById('pwError').style.display='block'; }

let attempts = Number(localStorage.getItem('attempts')||0);
function initIntro(){
  document.getElementById('screen-intro').classList.remove('hidden');

}

function checkA(i){ if(i===quiz[qi].c){ totalPoints+=10; qi++; qi<quiz.length?loadQ():startMaze(); } else { wrongAnswers++; totalPoints-=1; alert('Falsch! -1 Punkt'); }}
